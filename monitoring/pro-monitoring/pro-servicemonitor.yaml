apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: web-pro
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - pro
  selector:
    matchLabels:
      app: web
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
