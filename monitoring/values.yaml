grafana:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - monitoring.localhost
    path: /
    pathType: Prefix

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

    # OJO: esto es lo que te arregla el datasource y tu UID "prometheus"
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      name: Prometheus
      uid: prometheus
      url: http://monitoring-kube-prometheus-prometheus:9090

# En k3s/k3d, para evitar ruido/targets que no existen (muy típico), desactivamos scrapes de control-plane
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false

# Y desactivamos reglas por defecto que dependen de esos componentes (si no, te saldrán alertas “basura”)
defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

# Alertas por entorno
additionalPrometheusRulesMap:
  dev-app-rules:
    groups:
      - name: dev.web.availability
        rules:
          - alert: DevWebReplicasNotReady
            expr: kube_deployment_status_replicas_available{namespace="dev", deployment="web"} < 2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "DEV: web con menos de 2 réplicas disponibles"
              description: "deployment dev/web tiene menos de 2 réplicas disponibles durante más de 2 minutos."

  pro-app-rules:
    groups:
      - name: pro.web.availability
        rules:
          - alert: ProWebReplicasNotReady
            expr: kube_deployment_status_replicas_available{namespace="pro", deployment="web"} < 4
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "PRO: web con menos de 4 réplicas disponibles"
              description: "deployment pro/web tiene menos de 4 réplicas disponibles durante más de 2 minutos."
      - name: pro.db.availability
        rules:
          - alert: ProMySQLPodNotReady
            expr: sum(kube_pod_status_ready{namespace="pro", pod=~"mysql-.*", condition="true"}) < 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "PRO: MySQL no está Ready"
              description: "No hay ningún pod de MySQL Ready en pro durante más de 1 minuto."

alertmanager:
  enabled: true

  # Monta el secret dentro del pod de Alertmanager en:
  # /etc/alertmanager/secrets/<nombre-del-secret>/<clave>
  alertmanagerSpec:
    secrets:
      - alertmanager-smtp

  # Configuración nativa de Alertmanager (ruta + receivers)
  config:
    global:
      resolve_timeout: 5m

      # SMTP (ejemplo con Gmail; ajusta a tu proveedor)
      smtp_smarthost: "smtp.gmail.com:587"
      smtp_from: "v.ogazon@gmail.com"
      smtp_auth_username: "v.ogazon@gmail.com"

      # Importante: lee la password desde el archivo montado del Secret
      smtp_auth_password_file: "/etc/alertmanager/secrets/alertmanager-smtp/smtp_password"

      # Normalmente true en 587 (STARTTLS)
      smtp_require_tls: true

    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      receiver: "email"
      routes:
        # Evita spam del Watchdog si lo tienes habilitado
        - match:
            alertname: Watchdog
          receiver: "null"

    receivers:
      - name: "null"

      - name: "email"
        email_configs:
          - to: "vicente.ogazon1@estudiant.uib.cat"
            send_resolved: true
