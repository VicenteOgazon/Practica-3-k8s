apiVersion: v1
kind: Namespace
metadata:
  name: pro
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: pro
data:
  MYSQL_HOST: mysql
  APP_PORT: "5000"
  APP_ENV: production
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MINIO_BUCKET: static-pro
  MINIO_PUBLIC_URL: http://minio:9000
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: pro
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: pro
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: host-mysql-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              readOnly: true
      volumes:
        - name: host-mysql-init
          hostPath:
            path: /imports/pro/mysql/init.sql
            type: File
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: pro
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: pro
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: pro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-04-18T19-09-19Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_BUCKET
              value: "static-pro"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: pro
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-04-18T16-45-29Z
          env:
            - name: MINIO_BUCKET
              value: "static-pro"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: host-imports-minio
              mountPath: /host/minio
              readOnly: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              echo "Waiting for MinIO..."
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                sleep 2
              done

              echo "Ensuring bucket exists: $MINIO_BUCKET"
              mc mb --ignore-existing "local/$MINIO_BUCKET"

              echo "Uploading host image..."
              test -f /host/minio/fondo.png

              mc cp /host/minio/fondo.png "local/$MINIO_BUCKET/fondo.png"

              echo "MinIO init done."
      volumes:
        - name: host-imports-minio
          hostPath:
            path: /imports/pro/minio
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: pro
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pro
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: app:pro
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: web-config
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MYSQL_PASSWORD
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pro-env
                  key: MINIO_ROOT_PASSWORD
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /live
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pro
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 5000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: pro
spec:
  ingressClassName: traefik
  rules:
    - host: app.pro.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80