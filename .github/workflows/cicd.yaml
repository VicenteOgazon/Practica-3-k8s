name: Lint / Format

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Ruff (lint)
        run: |
          ruff check app

      - name: Black (format check)
        run: |
          black --check app

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r dockerfile/pro_requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest -q test/unit/test-unit.py

  build-push:
    name: Build & Push images (GHCR)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      REGISTRY: ghcr.io
      # Nombre del repositorio de imagen (ajústalo si quieres otro)
      IMAGE_REPO: ghcr.io/vicenteogazon/practica3-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push DEV image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile/dev_Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:dev
            ${{ env.IMAGE_REPO }}:dev-${{ github.sha }}

      - name: Build & push PRO image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile/pro_Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:pro
            ${{ env.IMAGE_REPO }}:pro-${{ github.sha }}
  
  deploy-simulated:
    name: Deploy (simulated)
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print deploy instructions
        run: |
          make deploy-simulated-all